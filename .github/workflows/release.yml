# -----------------------------------------------------------------------------
# Cut a new release — entirely from the GitHub UI, no local tooling needed.
#
# In GitHub: Actions -> Release -> "Run workflow" -> pick patch / minor / major.
#
# What it does, in one run:
#   1. computes the next semver from `package.json` (npm version rules);
#   2. writes it into `package.json`, `package-lock.json` AND the manifest
#      (`gladys-assistant-integration.json`: both `version` and the
#      `docker_image` tag, so the indexer and the image stay in lockstep);
#   3. commits the bump and pushes the `vX.Y.Z` tag;
#   4. calls build.yml to publish the multi-arch image (`:X.Y.Z` + `:latest`).
#
# Why call build.yml instead of relying on the tag push: a tag pushed with the
# default GITHUB_TOKEN does NOT trigger other workflows, so we invoke the build
# ourselves. No personal access token to create.
# -----------------------------------------------------------------------------
name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Version bump for this release'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump and push the tag
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump version and update the manifest
        id: bump
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          set -euo pipefail

          # npm computes the next semver and writes it to package.json (and
          # package-lock.json). --no-git-tag-version: we own the commit + tag
          # below, so npm must not touch git.
          new_version="$(npm version "$RELEASE_TYPE" --no-git-tag-version | tail -n1)"
          new_version="${new_version#v}" # v1.2.0 -> 1.2.0

          image="ghcr.io/${GITHUB_REPOSITORY,,}:${new_version}"

          # Keep the manifest in lockstep: the version the indexer reads AND the
          # image tag Gladys pulls must both point at this release. The script
          # rewrites those two values in place: jq reprinted the whole file,
          # which left it unformatted and turned the next CI run red.
          node .github/scripts/release.mjs "$new_version" "$image"

          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      # Note: if the branch you release from is protected against direct pushes,
      # GitHub rejects the push below (the default GITHUB_TOKEN cannot bypass
      # branch protection). Allow GitHub Actions to bypass the rule, or release
      # from an unprotected branch.
      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json gladys-assistant-integration.json
          git commit -m "chore(release): ${VERSION}"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${VERSION}"

  # Build and publish the image for the version we just tagged.
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.prepare.outputs.version }}

  # The changelog users read. Gladys turns the installed version number into a
  # link to this repository's releases, filtered on that version: a tag without
  # a release leaves them on "no releases found". The body is the matching
  # section of CHANGELOG.md.
  #
  # After `build` on purpose: a changelog entry nobody wrote must never keep
  # the image from being published. The release is created either way (with a
  # placeholder body), and the job then fails so the omission is seen.
  publish-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # Re-running a release must never silently overwrite notes edited by
          # hand in the GitHub UI.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Release v${VERSION} already exists, left untouched."
            exit 0
          fi

          notes_status=0
          node .github/scripts/release-notes.mjs "$VERSION" release-notes.md || notes_status=$?
          if [ "$notes_status" -ne 0 ] && [ "$notes_status" -ne 3 ]; then
            exit "$notes_status"
          fi

          # The title is the bare version, as the releases published by hand.
          gh release create "v${VERSION}" --title "${VERSION}" --notes-file release-notes.md

          if [ "$notes_status" -eq 3 ]; then
            echo "::error::CHANGELOG.md has no \"## ${VERSION}\" section: the release was created with a placeholder body. Write the section and edit the release notes."
            exit 1
          fi
